<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Vela">
  <title>Vela</title>
  <!--
    Four chevrons opening outward — V, >, ∧, < — their points turned toward
    the centre and blunted, never quite meeting.

    Traced from the reference mark rather than reconstructed by eye: three
    attempts at rebuilding it parametrically all drifted, because the inner
    points are cut flat and the arms are wider than they look.
  -->

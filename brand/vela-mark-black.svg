<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Vela">
  <title>Vela</title>
  <!--
    Four chevrons: V, >, ∧, < — opening outward, points turned toward the
    centre without meeting it. One arm rotated four times, so the mark is a
    single path and keeps its silhouette down to a 40px device icon.

      68,26 / 132,26   outer tips
      88,26 / 112,26   inner tips (the notch mouth)
      100,52           notch floor
      100,84           point, stopping short of the centre
  -->
  <defs>
    <path id="vela-arm" d="M 68,26 L 100,84 L 132,26 L 112,26 L 100,52 L 88,26 Z"/>
  </defs>
  <g fill="#0d1520">
    <use href="#vela-arm"/>
    <use href="#vela-arm" transform="rotate(90 100 100)"/>
    <use href="#vela-arm" transform="rotate(180 100 100)"/>
    <use href="#vela-arm" transform="rotate(270 100 100)"/>
  </g>
</svg>
